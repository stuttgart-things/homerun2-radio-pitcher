---
name: Build, Push & Scan Container Image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.11"
      registry: ghcr.io
      # The head of the pull request, not the merge commit.
      ref: ${{ github.event.pull_request.head.sha }}
      tags: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},pr-${{ github.event.number }}
    secrets: inherit # pragma: allowlist secret

  build-main:
    if: github.event_name != 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.11"
      # Without registry and tags call-ko-build falls back to ttl.sh.
      registry: ghcr.io
      tags: main
    secrets: inherit # pragma: allowlist secret

  # Trivy scans the image call-ko-build just pushed. Report-only for now.
  scan-pr:
    if: github.event_name == 'pull_request'
    needs: build-pr
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-trivy-image-scan.yaml@main
    with:
      runs-on: ubuntu-latest
      image-ref: ${{ needs.build-pr.outputs.image-ref }}
      severity: HIGH,CRITICAL
      artifact-name: trivy-image-report-pr-${{ github.event.number }}
      continue-on-error: true

  scan-main:
    if: github.event_name != 'pull_request'
    needs: build-main
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-trivy-image-scan.yaml@main
    with:
      runs-on: ubuntu-latest
      image-ref: ${{ needs.build-main.outputs.image-ref }}
      severity: HIGH,CRITICAL
      artifact-name: trivy-image-report-main
      continue-on-error: true
