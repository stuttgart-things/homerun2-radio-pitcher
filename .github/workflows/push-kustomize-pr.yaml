---
name: Push PR Kustomize OCI
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  push-kustomize:
    # Declared here as well as in the called workflow: a reusable workflow
    # can narrow the caller's token but never widen it, so leaving this to
    # the repository default is how a push quietly turns into a 403.
    permissions:
      contents: read
      packages: write
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-push-kustomize.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ubuntu-latest
      # The head of the pull request, not the merge commit.
      ref: ${{ github.event.pull_request.head.sha }}
      kcl-source-dir: kcl
      kcl-profile-file: tests/kcl-deploy-profile.yaml
      kustomize-oci-repo: ghcr.io/stuttgart-things/homerun2-radio-pitcher-kustomize
      tag: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
    secrets: inherit # pragma: allowlist secret
